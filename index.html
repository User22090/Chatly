<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatly - Smart AI Assistant</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- THEME CONFIGURATIONS --- */
        /* 1. Default Light Theme (Sampling colors from the Chatly logo) */
        :root, [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f5f7fb 0%, #e4e8f0 100%);
            --brand-gradient: linear-gradient(135deg, #00b0ff 0%, #8a2be2 100%);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --white: #ffffff;
            --bot-msg-bg: #f1f5f9;
            --container-bg: #ffffff;
            --border-color: #f1f5f9;
            --input-border: #e2e8f0;
        }

        /* 2. Sleek Dark Theme */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --brand-gradient: linear-gradient(135deg, #0284c7 0%, #6d28d9 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --white: #1e293b;
            --bot-msg-bg: #334155;
            --container-bg: #0f172a;
            --border-color: #1e293b;
            --input-border: #334155;
        }

        /* 3. Neon Cyberpunk Theme */
        [data-theme="cyber"] {
            --bg-gradient: linear-gradient(135deg, #0d0c1d 0%, #1a162b 100%);
            --brand-gradient: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%);
            --text-main: #00ffff;
            --text-muted: #ff00ff;
            --white: #120e24;
            --bot-msg-bg: #251b45;
            --container-bg: #0d0c1d;
            --border-color: #ff00ff33;
            --input-border: #ff00ff66;
        }

        /* --- MAIN INTERFACE STYLING --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            transition: background 0.3s ease;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: var(--container-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* Header UI matching Logo Gradients */
        .chat-header {
            background: var(--brand-gradient);
            padding: 20px 24px;
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Referencing layout proportions inspired by "ChatGPT Image May 30, 2026, 09_31_28 PM.png" */
        .logo-placeholder {
            font-size: 28px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .chat-header .status {
            font-size: 0.8rem;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
        }

        /* Theme Dropdown Select Styling */
        .theme-switcher select {
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 10px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .theme-switcher select option {
            background: #1e293b;
            color: #ffffff;
        }

        /* Message Feed Body */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        /* Chat Bubbles */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bot-message {
            align-self: flex-start;
        }

        .bot-message .message-content {
            background: var(--bot-msg-bg);
            color: var(--text-main);
            border-top-left-radius: 4px;
        }

        .user-message {
            align-self: flex-end;
        }

        .user-message .message-content {
            background: var(--brand-gradient);
            color: var(--white);
            border-top-right-radius: 4px;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        .user-message .timestamp {
            align-self: flex-end;
        }

        /* Typing Indicator Animation */
        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Footer & Inputs */
        .chat-input-area {
            padding: 16px 24px 12px 24px;
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--input-border);
            border-radius: 14px;
            background: var(--container-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        #sendBtn {
            background: var(--brand-gradient);
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        #sendBtn:hover {
            opacity: 0.9;
        }

        /* Team Credits */
        .dev-credits {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 12px;
        }

        .dev-credits span {
            font-weight: 600;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Chat Header Area -->
        <header class="chat-header">
            <div class="brand-info">
                <div class="logo-placeholder">🤖</div>
                <div>
                    <h1>Chatly</h1>
                    <p class="status"><span class="status-dot"></span> Online</p>
                </div>
            </div>
            <!-- Dynamic Theme Selector Selection -->
            <div class="theme-switcher">
                <select id="themeSelect" aria-label="Switch Chatly Theme">
                    <option value="light">☀️ Light</option>
                    <option value="dark">🌙 Dark</option>
                    <option value="cyber">🔮 Cyberpunk</option>
                </select>
            </div>
        </header>

        <!-- Chat Messages Main Feed -->
        <main class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    Hello! I'm Chatly. How can I help you today?
                </div>
                <span class="timestamp">Just now</span>
            </div>
        </main>

        <!-- Chat Input Form Elements -->
        <footer class="chat-input-area">
            <form id="chatForm" class="input-container">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Type a message to Chatly..." 
                    autocomplete="off" 
                    required
                >
                <button type="submit" id="sendBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
                    </svg>
                </button>
            </form>
            <div class="dev-credits">
                Developed by <span>Arjit</span> & <span>Vaibhav</span>
            </div>
        </footer>
    </div>

    <!-- Application Controller Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const chatForm = document.getElementById("chatForm");
            const userInput = document.getElementById("userInput");
            const chatMessages = document.getElementById("chatMessages");
            const themeSelect = document.getElementById("themeSelect");

            // --- Theme Selection Interceptor ---
            themeSelect.addEventListener("change", (e) => {
                const targetTheme = e.target.value;
                document.documentElement.setAttribute("data-theme", targetTheme);
            });

            // --- Chat Message Submission Loop ---
            chatForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const messageText = userInput.value.trim();
                if (!messageText) return;

                // Render User input message
                appendMessage(messageText, "user");
                userInput.value = ""; 

                // Render animated typing state wrapper
                const typingIndicator = appendTypingIndicator();

                try {
                    // Send to Arjit & Vaibhav's backend handler below
                    const botResponse = await sendMessageToBackend(messageText);
                    
                    typingIndicator.remove();
                    appendMessage(botResponse, "bot");
                } catch (error) {
                    console.error("Integration Error:", error);
                    typingIndicator.remove();
                    appendMessage("Sorry, I encountered an issue interacting with the backend server.", "bot");
                }
            });

            function appendMessage(text, sender) {
                const messageDiv = document.createElement("div");
                messageDiv.classList.add("message", `${sender}-message`);
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                messageDiv.innerHTML = `
                    <div class="message-content">${escapeHTML(text)}</div>
                    <span class="timestamp">${time}</span>
                `;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function appendTypingIndicator() {
                const typingDiv = document.createElement("div");
                typingDiv.classList.add("message", "bot-message");
                typingDiv.innerHTML = `
                    <div class="message-content">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                `;
                chatMessages.appendChild(typingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return typingDiv;
            }

            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }

            /* ==========================================================================
               BACKEND INTEGRATION PLACEHOLDER (For Arjit & Vaibhav)
               ========================================================================== */
            async function sendMessageToBackend(userPrompt) {
                /**
                 * Arjit & Vaibhav: Swap the mock logic below with your production integration.
                 * Example:
                 * const response = await fetch("https://your-api.com/chat", {
                 *     method: "POST",
                 *     headers: { "Content-Type": "application/json" },
                 *     body: JSON.stringify({ message: userPrompt })
                 * });
                 * const data = await response.json();
                 * return data.reply;
                 */
                
                // Simulated latency response
                await new Promise(resolve => setTimeout(resolve, 1200));
                return `You sent: "${userPrompt}". Your integration function is running! Wire up your endpoints inside the script tag.`;
            }
        });
    </script>
</body>
</html>
